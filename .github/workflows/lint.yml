---
name: Ansible lint
on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

jobs:
  yaml-lint:
    name: Lint yaml files
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-yaml-lint.yaml@main
    with:
      runs-on: ghr-install-requirements-in-cluster
      environment-name: k8s
      continue-error: true
      yamllint-version: 1
      lintprofile-path: .yamllint
      artifact-name: yaml-lint

  ansible-lint:
    name: Lint ansible code
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ansible-lint.yaml@main # ansible-lint-24.2.1
    with:
      runs-on: ghr-install-requirements-in-cluster
      environment-name: k8s
      continue-error: false
      ansible-image: ghcr.io/stuttgart-things/sthings-ansible:13.5.0-test
      # The repo root, not tests/test.yml: the test play names the role by its
      # directory name, which ansible-lint cannot resolve from tests/
      # (syntax-check[specific], so the role itself was never linted).
      playbook: .
      # Lint is clean: findings fail the job (github-workflow-templates#228).
      fail-on-findings: true
    needs: yaml-lint
