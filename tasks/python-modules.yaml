---
- name: Detect Python version
  ansible.builtin.command: "{{ python_bin }} -c 'import sys; print(\"{}.{}\".format(sys.version_info[0], sys.version_info[1]))'"
  register: python_version_output
  changed_when: false

- name: Set Python version fact
  ansible.builtin.set_fact:
    python_version: "{{ python_version_output.stdout }}"

- name: Ensure Python venv and dev packages are installed (Debian/Ubuntu)
  ansible.builtin.package:
    name:
      - "python{{ python_version }}-venv"
      - "python{{ python_version }}-dev"
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure Python venv and dev packages are installed (RedHat/Fedora)
  ansible.builtin.package:
    name:
      - python3-devel
      - python3-pip
      # ansible.builtin.pip imports `packaging` in the interpreter that runs the
      # module (the system python3), not in the venv. Ubuntu ships it with the
      # cloud image; Rocky/RHEL 10 does not -> "Failed to import the required
      # Python library (packaging)" (stuttgart-things/stuttgart-things#4489).
      - python3-packaging
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create virtual environment
  ansible.builtin.command: "{{ python_bin }} -m venv {{ venv_path }}"
  args:
    creates: "{{ venv_path }}"
  become: true

- name: Ensure pip is available in the virtual environment
  ansible.builtin.command: "{{ venv_path }}/bin/python -m ensurepip --upgrade"
  args:
    creates: "{{ venv_path }}/bin/pip"
  become: true

- name: Upgrade pip and setuptools to avoid Python 3.12+ issues
  ansible.builtin.command: "{{ venv_path }}/bin/pip install --upgrade pip setuptools packaging"
  become: true
  changed_when: false

- name: Check pip version
  ansible.builtin.command: "{{ venv_path }}/bin/pip --version"
  register: pip_version
  changed_when: false

- name: Show pip version
  ansible.builtin.debug:
    var: pip_version.stdout

- name: Install required Python modules in venv
  ansible.builtin.pip:
    name: "{{ item.name }}"
    version: "{{ item.version | default(omit) }}"
    executable: "{{ venv_path }}/bin/pip"
  loop: "{{ python_modules }}"
  when: python_modules is defined
  become: true

- name: Set interpreter for later tasks
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ venv_path }}/bin/python"
